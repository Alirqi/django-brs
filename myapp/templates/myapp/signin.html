{% extends 'myapp/base.html' %}
{% block content %}
<div class="container py-3">
    <div class="card bg-info bg-gradient">
        <div class="card-body">
            <h2 class="my-3 text-center text-light">Welcome to XYZ Liner Transit Corporation</h2>
        </div>
    </div>
    <div class="row justify-content-center mt-4">
        <div class="col-lg-5 col-md-7 col-sm-10">
            <div class="card rounded-0">
                <div class="card-header"><h3 class="mb-0 text-center">Login</h3></div>
                <div class="card-body">
                    <form action="{% url 'signin' %}" method="post" id="signin-form">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input name="name" class="form-control rounded-0" type="text" id="username" autocomplete="username" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input name="password" id="password" class="form-control rounded-0" type="password" autocomplete="current-password" required>
                        </div>
                        {% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
                    </form>
                </div>
                <div class="card-footer text-center">
                    <button class="btn btn-primary w-100" form="signin-form">Login</button>
                    <a class="d-inline-block mt-2" href="{% url 'signup' %}">Create an account</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
