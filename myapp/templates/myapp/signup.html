{% extends 'myapp/base.html' %}
{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7 col-sm-10">
            <div class="card rounded-0">
                <div class="card-header"><h3 class="text-center mb-0">Registration</h3></div>
                <div class="card-body">
                    <form action="{% url 'signup' %}" method="post" id="registration-form">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input name="email" class="form-control" type="email" id="email" autocomplete="email" required>
                        </div>
                        <div class="mb-3">
                            <label for="name" class="form-label">Username</label>
                            <input name="name" id="name" class="form-control" type="text" maxlength="150" autocomplete="username" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input name="password" id="password" class="form-control" type="password" minlength="8" autocomplete="new-password" required>
                        </div>
                        {% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
                    </form>
                </div>
                <div class="card-footer text-center">
                    <button class="btn btn-primary rounded-0 w-100" form="registration-form">Create Account</button>
                    <a class="d-inline-block mt-2" href="{% url 'signin' %}">Already registered? Sign in</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
